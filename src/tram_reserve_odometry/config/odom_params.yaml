tram_reserve_odometry:
  ros__parameters:
    # Organizer clarification overrides the old README: raw bogie speeds are km/h.
    wheel_units: "kmph"
    frame_id: "map"
    child_frame_id: "base_link"

    # Geometry supplied by organizers, REP-103 base_link.
    wheelbase_m: 7.55
    master_x_m: -9.873
    rover_x_m: 2.563
    antenna_z_m: 3.0

    # GNSS is ONLY an initialization/reference channel and is frozen afterwards.
    gnss_init_seconds: 5.0
    gnss_pair_tolerance_s: 0.20

    # Output frame = organizer pathgraph frame = UTM zone 37N minus the grid offset
    # (verified: GNSS of the runs lies on the pathgraph tracks within ~5 cm).
    utm_zone: 37
    grid_offset_easting: 300000.0
    grid_offset_northing: 6100000.0

    # Route map: organizer pathgraph (ST + TS) + terminal pieces, see tools/build_route.py.
    # Relative paths are resolved against the package share directory.
    path_file: "config/route.json"
    path_z_is_rail_height: true
    max_path_init_lateral_m: 100.0
    join_length_m: 30.0
    # Platform stop anchoring (map-matching on surveyed stopping points in route.json).
    # Set stop_anchor_gain to 0.0 to disable.
    stop_anchor_min_s: 8.0
    stop_anchor_window_m: 25.0
    stop_anchor_gain: 0.8

    manual_initialization: false
    initial_easting: 0.0
    initial_northing: 0.0
    initial_z: 0.0
    initial_yaw: 0.0

    # Nonlinear drive + estimator parameters (tuned by tools/replay_eval.py on TRAIN bags).
    tau_accel: 0.35
    wheel_sigma: 0.10
    process_accel_sigma: 1.5
    max_speed_mps: 25.0
    bias_adapt_gain: 0.006

    # Explicit path-dependent terms. dynamics_coeffs were identified without the grade
    # term, so the mean grade is already inside them: grade_gain=1 double-counts it.
    grade_gain: 0.0
    curve_accel_per_curvature: 0.0

    # Robust innovation/slip logic.
    nis_gate: 9.0
    stop_speed_mps: 0.06
    stop_confirm_s: 0.35
    wheel_fresh_s: 0.22
    common_slip_weight: 1.0
    # Both bogies agreeing within this bound are trusted even against the model
    # (real emergency/track-brake decelerations are not outliers).
    consensus_tol_mps: 0.15
    publish_max_rate_hz: 50.0

    # Optional physical drivetrain parameters. Leave zeros until official values are known.
    # When filled, /result/model_motor_torque_nm becomes available.
    vehicle_mass_kg: 0.0
    wheel_radius_m: 0.0
    gear_ratio: 0.0
    drive_efficiency: 1.0
    driven_equivalent_count: 1.0

    # tools/calibrate_from_bags.py fit on the full dataset (calibration.json).
    dynamics_coeffs: [-0.101347373553, 2.24722414933, -0.722776112188,
                      -2.41830733901, 1.73151381592, 0.0143448652614,
                      -0.000665941677832, -0.0794667487301, -0.0174199129043]
